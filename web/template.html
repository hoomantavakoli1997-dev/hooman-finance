<title>Hooman Finance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
/* Layout: one narrow phone-style column, bottom tab bar, sheets slide over the content.
   Palette: deep navy and turquoise on cool teal-tinted neutrals. Type: Vazirmatn. */
:root {
  --bg: #eef4f6;
  --surface: #ffffff;
  --surface-2: #e4eef1;
  --ink: #0d2233;
  --muted: #53697a;
  --line: #cfdee4;
  --navy: #0b2a4a;
  --navy-ink: #f2f8fb;
  --navy-muted: #a9c3d6;
  --teal: #12b3b0;
  --teal-ink: #04302f;
  --teal-text: #0a7377;
  --gain: #0b7a4b;
  --loss: #b3261e;
  --warn-bg: #fff3cf;
  --warn-ink: #5e4200;
  --scrim: rgba(7, 20, 32, 0.55);
  --focus: #0a7377;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948; --c-other: #8a8f94;
  --font: 'Vazirmatn', Tahoma, 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #08141d; --surface: #0f2230; --surface-2: #163042; --ink: #e5f0f4; --muted: #9bb3bf;
    --line: #21394a; --navy: #123c66; --navy-ink: #f2f8fb; --navy-muted: #b3cce0;
    --teal: #2cd2cd; --teal-ink: #032a29; --teal-text: #4fe0db; --gain: #46d391; --loss: #ff8a80;
    --warn-bg: #3b2f0b; --warn-ink: #ffe29a; --scrim: rgba(0, 0, 0, 0.65); --focus: #4fe0db;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767; --c-other: #7d868c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #08141d; --surface: #0f2230; --surface-2: #163042; --ink: #e5f0f4; --muted: #9bb3bf;
  --line: #21394a; --navy: #123c66; --navy-ink: #f2f8fb; --navy-muted: #b3cce0;
  --teal: #2cd2cd; --teal-ink: #032a29; --teal-text: #4fe0db; --gain: #46d391; --loss: #ff8a80;
  --warn-bg: #3b2f0b; --warn-ink: #ffe29a; --scrim: rgba(0, 0, 0, 0.65); --focus: #4fe0db;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767; --c-other: #7d868c;
  color-scheme: dark;
}

html { font-size: 17px; }
html[data-font="large"] { font-size: 20px; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 1rem 6.5rem;
}
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
bdi { unicode-bidi: isolate; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.muted { color: var(--muted); }
.shell { max-width: 40rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }

/* header */
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 1.35rem; font-weight: 800; }
.top .date { color: var(--muted); font-size: .9rem; }
.back { background: none; border: 0; color: var(--teal-text); font-weight: 600; padding: .25rem 0; min-height: 2.5rem; }

/* hero */
.hero { background: linear-gradient(145deg, var(--navy), color-mix(in srgb, var(--navy) 78%, var(--teal))); color: var(--navy-ink); border-radius: 1.25rem; padding: 1.25rem; display: flex; flex-direction: column; gap: .75rem; box-shadow: 0 10px 26px rgba(7, 35, 57, .14); position: relative; overflow: hidden; }
.hero .eye { background: transparent; border: 0; color: var(--navy-ink); min-width: 2.75rem; min-height: 2.75rem; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; margin: -.5rem; }
.hero .eye:focus-visible { outline: 2px solid var(--teal); }
.hero .label { color: var(--navy-muted); font-size: .95rem; }
.hero .big { font-size: clamp(1.5rem, 8vw, 2.1rem); font-weight: 800; line-height: 1.3; color: var(--navy-ink); }
.hero .big .u { font-size: 1rem; font-weight: 600; color: var(--teal); margin-inline-start: .25rem; }
.hero .split { display: flex; flex-wrap: wrap; gap: .25rem 1.5rem; color: var(--navy-muted); font-size: .95rem; }
.hero .split b { color: var(--navy-ink); font-weight: 600; }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: .75rem; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; padding: .9rem 1rem; display: flex; flex-direction: column; gap: .15rem; min-width: 0; box-shadow: 0 3px 12px rgba(12, 42, 62, .035); }
.tile .k { color: var(--muted); font-size: .85rem; }
.tile .v { font-size: 1.05rem; font-weight: 700; }
.history { gap: .75rem; }
.history-summary { display:flex; align-items:center; justify-content:space-between; gap:.75rem; }
.history-summary > div { display:flex; flex-direction:column; min-width:0; }
.history-summary strong { font-size:1.12rem; font-weight:800; overflow-wrap:anywhere; }
.history-summary small,.history-foot { color:var(--muted); font-size:.8rem; }
.history-summary > span { font-weight:800; white-space:nowrap; }
.history-svg { display:block; width:100%; height:auto; min-height:7rem; overflow:visible; }
.history-ends { display:flex; justify-content:space-between; color:var(--muted); font-size:.75rem; }
.history .chips { gap:.35rem; }
.history .chip { min-height:2.15rem; padding-inline:.7rem; font-size:.8rem; }
.history-empty { padding:1rem .5rem; text-align:center; color:var(--muted); font-size:.88rem; background:var(--surface-2); border-radius:.75rem; }
.history-foot { margin:0; line-height:1.7; }
.u { font-size: .8em; font-weight: 400; color: var(--muted); }

/* lists */
.section-title { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: .5rem 0 0; font-size: 1.05rem; font-weight: 700; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; overflow: hidden; }
.row { display: flex; gap: .75rem; align-items: center; justify-content: space-between; padding: .9rem 1rem; border-top: 1px solid var(--line); width: 100%; background: none; border-inline: 0; border-bottom: 0; text-align: start; min-width: 0; transition: background .16s ease, transform .16s ease; }
.row:first-child { border-top: 0; }
button.row:hover { background: var(--surface-2); }
button.row:active { transform: scale(.992); }
.row.dim { opacity: .62; }
.row .main { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.row .t { font-weight: 600; }
.row .s { color: var(--muted); font-size: .85rem; }
.row .side { text-align: end; display: flex; flex-direction: column; align-items: flex-end; gap: .1rem; min-width: 0; }
.bar { height: .35rem; background: var(--surface-2); border-radius: 1rem; overflow: hidden; margin-top: .35rem; }
.bar i { display: block; height: 100%; background: var(--teal); border-radius: 1rem; }
.gain { color: var(--gain); }
.loss { color: var(--loss); }
.empty { padding: 1.5rem 1rem; text-align: center; color: var(--muted); }

/* buttons */
.btn { min-height: 3rem; padding: .5rem 1.1rem; border-radius: .85rem; border: 2px solid transparent; font-weight: 700; background: var(--teal); color: var(--teal-ink); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn.danger { background: var(--loss); color: #fff; }
.btn.small { min-height: 2.4rem; padding: .2rem .8rem; font-size: .9rem; }
.btn.link { background: none; border: 0; color: var(--teal-text); min-height: 2.4rem; padding: .2rem .4rem; font-weight: 600; }
.btn.link.bad { color: var(--loss); }
.actions { display: flex; flex-wrap: wrap; gap: .6rem; }
.actions .btn { flex: 1 1 7rem; }

.chips { display: flex; gap: .5rem; overflow-x: auto; padding-bottom: .25rem; }
.chip { flex: none; min-height: 2.4rem; padding: .1rem .9rem; border-radius: 2rem; border: 1px solid var(--line); background: var(--surface); }
.chip[aria-pressed="true"] { background: var(--navy); color: var(--navy-ink); border-color: var(--navy); }
.badge { display: inline-block; font-size: .75rem; font-weight: 700; padding: 0 .55rem; border-radius: 1rem; background: var(--surface-2); color: var(--ink); }
.badge.buy { background: color-mix(in srgb, var(--teal) 25%, var(--surface)); }
.badge.receive { background: color-mix(in srgb, var(--teal) 12%, var(--surface)); }
.badge.deposit { background: color-mix(in srgb, var(--teal) 25%, var(--surface)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; padding: 1rem; display: flex; flex-direction: column; gap: .75rem; min-width: 0; box-shadow: 0 4px 16px rgba(12, 42, 62, .045); }
.between { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
.check { display: flex; align-items: center; gap: .6rem; font-size: .95rem; cursor: pointer; }
.check input { width: 1.3rem; height: 1.3rem; accent-color: var(--teal); flex: none; }
.alloc { display: flex; flex-direction: column; gap: 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; padding: 1rem; }
.ab { display: flex; flex-direction: column; gap: .35rem; min-width: 0; }
.ah { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.ah .nm { display: flex; align-items: center; gap: .5rem; min-width: 0; font-weight: 700; }
.ah .tx { overflow-wrap: anywhere; }
.ah .pc { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.track { height: .7rem; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 999px; }
.ab .am { color: var(--muted); font-size: .85rem; }
.ico { flex: none; width: 2.7rem; height: 2.7rem; border-radius: .85rem; overflow: hidden; background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; padding: .2rem; }
.ico svg { display: block; border-radius: .5rem; }
.ico.sm { width: 1.7rem; height: 1.7rem; border-radius: .55rem; padding: .1rem; }
.market-row { gap: .65rem; }
.market-ico { flex: none; width: 2.65rem; height: 2.65rem; display: inline-flex; align-items: center; justify-content: center; border-radius: .85rem; overflow: hidden; background: var(--surface-2); padding: .18rem; }
.market-ico svg { width: 100%; height: 100%; display: block; }
.market-row .main { gap: .08rem; }
.market-row .side .t { white-space: nowrap; font-variant-numeric: tabular-nums; }
.row > .ico + .main { flex: 1; }
.formula { margin-top: .6rem; font-size: .82rem; opacity: .85; }
.badge.sell { background: color-mix(in srgb, var(--navy) 18%, var(--surface)); }

.note { background: var(--warn-bg); color: var(--warn-ink); border-radius: 1rem; padding: .75rem 1rem; font-size: .92rem; display: flex; flex-direction: column; gap: .4rem; }
.note.info { background: var(--surface-2); color: var(--ink); }
.note .btn.link { color: inherit; text-decoration: underline; align-self: flex-start; }

/* nav */
.nav { position: fixed; inset-inline: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); z-index: 5; }
.nav .in { max-width: 40rem; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.nav button { background: none; border: 0; padding: .5rem .1rem .45rem; display: flex; flex-direction: column; align-items: center; gap: .1rem; color: var(--muted); font-size: .72rem; min-height: 3.6rem; }
.nav button svg { width: 1.5rem; height: 1.5rem; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-current="page"] { color: var(--teal-text); font-weight: 700; }

/* forms and sheets */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 40rem; max-height: 94%; overflow-y: auto; border-radius: 1.25rem 1.25rem 0 0; padding: 1.1rem max(16px, env(safe-area-inset-left, 0px)) calc(1.25rem + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: .9rem; }
.sheet > * { flex-shrink: 0; }
.sheet h2 { margin: 0; font-size: 1.2rem; font-weight: 800; }
.field { display: flex; flex-direction: column; gap: .3rem; min-width: 0; }
.field > label, .field > .lab { font-size: .88rem; color: var(--muted); font-weight: 600; }
.field input, .field select, .field textarea { background: var(--surface); border: 2px solid var(--line); border-radius: .8rem; padding: .6rem .8rem; min-height: 3rem; width: 100%; font-size: 1.05rem; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--teal); outline: none; }
.field .hint { font-size: .8rem; color: var(--muted); }
.three { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: .5rem; }
.seg { display: flex; border: 2px solid var(--line); border-radius: .9rem; overflow: hidden; background: var(--surface); }
.seg button { flex: 1; min-height: 2.9rem; border: 0; background: none; font-weight: 600; padding: 0 .5rem; }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--navy-ink); }
.live { background: var(--surface); border: 1px dashed var(--line); border-radius: 1rem; padding: .75rem 1rem; display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; }
.live .v { font-size: 1.2rem; font-weight: 800; }
.err { color: var(--loss); font-weight: 600; font-size: .92rem; }
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; }
.summary .row { cursor: default; }
.toast { position: fixed; inset-inline: 0; bottom: calc(5.2rem + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; z-index: 30; pointer-events: none; padding: 0 1rem; }
.toast .in { pointer-events: auto; background: var(--ink); color: var(--bg); border-radius: 1rem; padding: .6rem 1rem; display: flex; gap: 1rem; align-items: center; max-width: 36rem; }
.toast button { background: none; border: 0; color: var(--teal); font-weight: 700; }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(1.5rem); opacity: .4; } to { transform: none; opacity: 1; } }
}

/* v17 visual refinement: retain the navy/turquoise identity, improve depth and hierarchy */
.hero { isolation:isolate; background:linear-gradient(132deg,#082746 0%,var(--navy) 58%,color-mix(in srgb,var(--teal) 24%,var(--navy)) 100%); }
.hero::before,.hero::after { content:""; position:absolute; z-index:-1; pointer-events:none; border:1px solid rgba(111,231,224,.16); border-radius:50%; }
.hero::before { width:13rem; height:13rem; inset-inline-end:-5.5rem; top:-7rem; box-shadow:0 0 0 1.3rem rgba(111,231,224,.035),0 0 0 2.6rem rgba(111,231,224,.025); }
.hero::after { width:7rem; height:7rem; inset-inline-start:-3.5rem; bottom:-4.5rem; background:rgba(18,179,176,.07); }
.hero > * { position:relative; z-index:1; }
.hero .big { letter-spacing:-.035em; text-shadow:0 2px 18px rgba(0,0,0,.12); }
.hero .split { align-items:center; }
.section-title { padding-inline-start:.7rem; border-inline-start:3px solid var(--teal); min-height:1.8rem; }
.tile { position:relative; overflow:hidden; border-color:color-mix(in srgb,var(--line) 78%,var(--teal)); box-shadow:0 5px 18px rgba(12,42,62,.055); }
.tile::after { content:""; position:absolute; inset-inline-end:-1.4rem; bottom:-2rem; width:4.5rem; height:4.5rem; border-radius:50%; background:color-mix(in srgb,var(--teal) 8%,transparent); pointer-events:none; }
.tile .v { overflow-wrap:anywhere; line-height:1.55; }
.list { box-shadow:0 5px 18px rgba(12,42,62,.045); }
.row { min-height:4.35rem; }
.row .t { line-height:1.5; }
.ico,.market-ico { background:linear-gradient(145deg,var(--surface-2),color-mix(in srgb,var(--surface) 70%,var(--teal))); border:1px solid color-mix(in srgb,var(--line) 72%,var(--teal)); box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 7px rgba(9,35,52,.07); }
.ico svg,.market-ico svg { filter:drop-shadow(0 1px 1px rgba(0,0,0,.08)); }
.ico.sm { box-shadow:none; }
.market-row { min-height:4.6rem; }
.market-row .side { gap:.18rem; }
.market-row .side .t { font-weight:800; }
.alloc { gap:1.1rem; box-shadow:0 5px 18px rgba(12,42,62,.04); }
.track { height:.62rem; background:color-mix(in srgb,var(--surface-2) 82%,var(--line)); }
.track i { box-shadow:0 0 8px color-mix(in srgb,currentColor 12%,transparent); }
.history { border-color:color-mix(in srgb,var(--teal) 22%,var(--line)); box-shadow:0 7px 22px rgba(12,42,62,.055); }
.history-summary { padding:.2rem 0 .35rem; }
.history-summary > span { padding:.3rem .65rem; border-radius:2rem; background:var(--surface-2); }
.chip { transition:background .16s ease,border-color .16s ease,transform .16s ease; }
.chip:active { transform:scale(.97); }
.nav { box-shadow:0 -5px 20px rgba(8,30,46,.055); backdrop-filter:blur(16px); }
.nav button { position:relative; transition:color .16s ease; }
.nav button[aria-current="page"]::before { content:""; position:absolute; top:0; width:1.8rem; height:3px; border-radius:0 0 4px 4px; background:var(--teal); }
@media (min-width:520px) {
  .hero { padding:1.5rem; }
  .grid2 { gap:.9rem; }
  .tile { padding:1rem 1.1rem; }
}

</style>
<div id="app" dir="rtl" lang="fa"></div>
<div id="modal" dir="rtl" lang="fa"></div>
<div id="toast" dir="rtl" lang="fa"></div>
<script>/*__BUNDLE__*/</script>
