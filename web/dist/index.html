    --line: #21394a; --navy: #123c66; --navy-ink: #f2f8fb; --navy-muted: #b3cce0;
    --teal: #2cd2cd; --teal-ink: #032a29; --teal-text: #4fe0db; --gain: #46d391; --loss: #ff8a80;
    --warn-bg: #3b2f0b; --warn-ink: #ffe29a; --scrim: rgba(0, 0, 0, 0.65); --focus: #4fe0db;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767; --c-other: #7d868c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #08141d; --surface: #0f2230; --surface-2: #163042; --ink: #e5f0f4; --muted: #9bb3bf;
  --line: #21394a; --navy: #123c66; --navy-ink: #f2f8fb; --navy-muted: #b3cce0;
  --teal: #2cd2cd; --teal-ink: #032a29; --teal-text: #4fe0db; --gain: #46d391; --loss: #ff8a80;
  --warn-bg: #3b2f0b; --warn-ink: #ffe29a; --scrim: rgba(0, 0, 0, 0.65); --focus: #4fe0db;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767; --c-other: #7d868c;

}

html { font-size: 17px; }
html[data-font="small"] { font-size: 15px; }
html[data-font="large"] { font-size: 20px; }

}

.shell { max-width: 40rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }

/* header */

.top h1 { margin: 0; font-size: 1.35rem; font-weight: 800; display:flex; align-items:center; gap:.55rem; }

.hero { background: linear-gradient(145deg, var(--navy), color-mix(in srgb, var(--navy) 78%, var(--teal))); color: var(--navy-ink); border-radius: 1.25rem; padding: 1.25rem; display: flex; flex-direction: column; gap: .75rem; box-shadow: 0 10px 26px rgba(7, 35, 57, .14); position: relative; overflow: hidden; }
.hero .eye { background: transparent; border: 0; color: var(--navy-ink); min-width: 2.75rem; min-height: 2.75rem; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; margin: -.5rem; }

.history-summary strong { font-size:1.12rem; font-weight:800; overflow-wrap:anywhere; }
.history-summary small,.history-foot { color:var(--muted); font-size:.8rem; }

/* buttons */
.btn { min-height: 3rem; padding: .5rem 1.1rem; border-radius: .85rem; border: 2px solid transparent; font-weight: 700; background: var(--teal); color: var(--teal-ink); }

.chip[aria-pressed="true"] { background: var(--navy); color: var(--navy-ink); border-color: var(--navy); }
.badge { display: inline-block; font-size: .75rem; font-weight: 700; padding: 0 .55rem; border-radius: 1rem; background: var(--surface-2); color: var(--ink); }
.badge.buy { background: color-mix(in srgb, var(--teal) 25%, var(--surface)); }

.track { height: .7rem; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 999px; }
.ab .am { color: var(--muted); font-size: .85rem; }
.ico { flex: none; width: 2.7rem; height: 2.7rem; border-radius: .85rem; overflow: hidden; background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; padding: .2rem; }
.ico svg { display: block; border-radius: .5rem; }

/* nav */
.nav { position: fixed; inset-inline: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); z-index: 5; }

.nav button svg { width: 1.5rem; height: 1.5rem; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-current="page"] { color: var(--teal-text); font-weight: 700; }

/* forms and sheets */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 40rem; max-height: 94%; overflow-y: auto; border-radius: 1.25rem 1.25rem 0 0; padding: 1.1rem max(16px, env(safe-area-inset-left, 0px)) calc(1.25rem + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: .9rem; }
.sheet > * { flex-shrink: 0; }

.field { display: flex; flex-direction: column; gap: .3rem; min-width: 0; }

.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--teal); outline: none; }
.field .hint { font-size: .8rem; color: var(--muted); }
.three { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: .5rem; }

.toast { position: fixed; inset-inline: 0; bottom: calc(5.2rem + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; z-index: 30; pointer-events: none; padding: 0 1rem; }

}

/* DARA v27 identity polish */
.hero { border:1px solid rgba(111,231,224,.14); }

.star[aria-pressed="true"] { color: #e0a800; }
.ab-btn { background: none; border: 0; padding: .15rem 0; width: 100%; text-align: start; font: inherit; color: inherit; cursor: pointer; border-radius: .6rem; }
.ab-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.ab .am { display: flex; justify-content: space-between; gap: .75rem; flex-wrap: wrap; }

/* --- قفل برنامه --- */
#lock { position: fixed; inset: 0; z-index: 200; background: var(--bg); color: var(--ink); display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
#lock[hidden] { display: none; }
.lockscr { width: 100%; max-width: 21rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
.lk-brand { font-weight: 800; font-size: 1.35rem; color: var(--teal-text); }
.lk-title { font-weight: 700; }
.lk-dots { display: flex; gap: .9rem; margin: .2rem 0; }
.lk-dots i { width: 1rem; height: 1rem; border-radius: 50%; border: 2px solid var(--teal-text); display: block; }
.lk-dots i.on { background: var(--teal-text); }
.lk-msg { min-height: 1.5rem; text-align: center; color: var(--loss); font-size: .9rem; }
.lk-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; width: 100%; direction: ltr; }
.lk-pad button { min-height: 4rem; border-radius: 1.2rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 1.6rem; font-weight: 700; cursor: pointer; }
.lk-pad button:active { background: var(--surface-2); }
.lk-pad button:disabled { opacity: .45; }
.lk-pad button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.pad-wrap { display: flex; justify-content: center; padding: .5rem 0; }
.pat { position: relative; width: min(17rem, 78vw); aspect-ratio: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); direction: ltr; touch-action: none; user-select: none; -webkit-user-select: none; }
.pat.off { opacity: .45; }
.pat-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.pat-svg polyline { fill: none; stroke: var(--teal-text); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
.pd { place-self: center; width: 1.15rem; height: 1.15rem; border-radius: 50%; background: var(--muted); transition: transform .1s, background .1s; pointer-events: none; }
.pd.on { background: var(--teal-text); transform: scale(1.6); }
/* یادآورها */
.top .ttl { display:flex; align-items:center; gap:.6rem; min-width:0; }
.bell { position:relative; display:inline-flex; align-items:center; justify-content:center; width:2.4rem; height:2.4rem; border-radius:.8rem; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; }
.bell .bd { position:absolute; top:-.35rem; inset-inline-start:-.35rem; min-width:1.15rem; height:1.15rem; padding:0 .25rem; border-radius:1rem; background:var(--loss, #d64545); color:var(--surface); font-size:.7rem; line-height:1.15rem; text-align:center; font-weight:800; }
.remcard { margin-block:.6rem; }
.row .s .btn.link { padding-inline:0 .8rem; min-height:0; }
.badge.loss { background: color-mix(in srgb, var(--loss, #d64545) 18%, var(--surface)); }

/* DARAM polish: cohesive icon tiles and a clearer obligations/alerts surface */
.ico, .market-ico { border: 1px solid color-mix(in srgb, var(--line) 72%, transparent); box-shadow: 0 3px 10px rgba(9, 32, 49, .07); transition: transform .18s ease, box-shadow .18s ease; }
.row .ico { background: color-mix(in srgb, var(--surface-2) 82%, var(--teal) 18%); }
.ico svg, .market-ico svg { filter: saturate(1.04); }
.card-rem { padding: .9rem .85rem; border-color: color-mix(in srgb, var(--teal) 28%, var(--line)); background: linear-gradient(145deg, var(--surface), color-mix(in srgb, var(--surface) 94%, var(--teal))); }
.card-rem .section-title { margin: 0; }
.rem-sub { display:block; color:var(--muted); font-size:.76rem; margin-top:.15rem; }
.rem-row { padding: .72rem .35rem; gap:.45rem; }
.rem-row .main { gap:.12rem; }
.rem-row .badge { flex:none; }
.rem-action { display:flex; align-items:center; flex-wrap:wrap; gap:.25rem .7rem; }
.rem-action .btn { min-height:1.7rem; }
.bell { box-shadow: 0 2px 8px rgba(9,32,49,.06); transition: transform .16s ease, background .16s ease; }
.bell:active, .ico:active { transform: scale(.96); }
@media (prefers-reduced-motion: reduce) { .ico, .market-ico, .bell { transition:none; } }
.rrcard { gap:.45rem; }
.rr { gap:.6rem; font-size:.92rem; padding:.2rem 0; border-bottom:1px dashed var(--line); }
.rr:last-of-type { border-bottom:0; }
.alloc { gap:.6rem; }
.allocwrap { display:flex; align-items:center; gap:1rem; flex-wrap:wrap; }
.donut { width:6.5rem; height:6.5rem; flex:none; transform:rotate(0deg); }
.alloclist { list-style:none; margin:0; padding:0; flex:1; min-width:9.5rem; display:flex; flex-direction:column; gap:.4rem; }
.alloclist li { display:grid; grid-template-columns:.8rem 1fr auto auto; align-items:center; gap:.5rem; font-size:.9rem; }
.alloclist .sw { width:.8rem; height:.8rem; border-radius:.2rem; }
.alloclist .nm { white-space:nowrap; }
.alloclist .pc { font-weight:700; }
.alloclist .am { color:var(--muted); font-size:.8rem; min-width:3.2rem; text-align:left; }
.tablewrap { overflow-x:auto; max-height:16rem; overflow-y:auto; border:1px solid var(--line); border-radius:.6rem; }
.loantbl { border-collapse:collapse; width:100%; font-size:.78rem; white-space:nowrap; }
.loantbl th, .loantbl td { padding:.35rem .5rem; text-align:right; border-bottom:1px solid var(--line); }
.loantbl th { position:sticky; top:0; background:var(--surface-2); }
.onb { display:flex; flex-direction:column; align-items:center; text-align:center; gap:.7rem; }
.onb-ic { width:4rem; height:4rem; border-radius:50%; display:grid; place-items:center; font-size:1.8rem; background:var(--navy); color:var(--teal); }
.onb p { margin:0; line-height:1.9; color:var(--muted); }
.onb-dots { display:flex; gap:.4rem; }
.onb-dots span { width:.5rem; height:.5rem; border-radius:50%; background:var(--line); }
.onb-dots span.on { background:var(--teal); width:1.2rem; border-radius:.3rem; }
.famprev { white-space:pre-wrap; background:var(--surface-2); border:1px solid var(--line); border-radius:.8rem; padding:.8rem; font:inherit; font-size:.88rem; line-height:1.9; max-height:40vh; overflow:auto; margin:.5rem 0; }
