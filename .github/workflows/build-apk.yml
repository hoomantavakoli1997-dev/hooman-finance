name: Build Dara Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm test
      - run: npm run web:build
      - name: Set build number and APK filename
        run: |
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('app.json'));a.expo.android.versionCode=${{ github.run_number }};a.expo.extra={build:${{ github.run_number }}};fs.writeFileSync('app.json',JSON.stringify(a,null,2))"
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "DARA_APK_NAME=Dara-v${VERSION}-build${{ github.run_number }}.apk" >> "$GITHUB_ENV"
      - run: npx expo prebuild --platform android --no-install
      - name: Apply Dara launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_launcher_daram.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#0B1F3A" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#123C66" android:pathData="M20,13h68a8,8 0,0 1,8 8v66a8,8 0,0 1,-8 8h-68a8,8 0,0 1,-8 -8v-66a8,8 0,0 1,8 -8z"/>
            <path android:fillColor="#2CD2CD" android:pathData="M22,24h10v60h-10z"/>
            <path android:fillColor="#F2C66D" android:pathData="M40,24h16c19,0 30,11 30,30s-11,30 -30,30h-16zM50,34v40h6c13,0 20,-7 20,-20s-7,-20 -20,-20z"/>
          </vector>
          XML
      - name: Shrink APK (only real phone CPUs)
        run: |
          cat >> android/gradle.properties <<'EOF2'
          reactNativeArchitectures=arm64-v8a,armeabi-v7a
          EOF2
      - name: Trust the Certum root for cdn.tsetmc.com only
        run: |
          set -e
          test "$(openssl x509 -in certs/certum_trusted_root_ca.pem -noout -fingerprint -sha256)" = "sha256 Fingerprint=FE:76:96:57:38:55:77:3E:37:A9:5E:7A:D4:D9:CC:96:C3:01:57:C1:5D:31:76:5B:A9:B1:57:04:E1:AE:78:FD"
          mkdir -p android/app/src/main/res/raw android/app/src/main/res/xml
          cp certs/certum_trusted_root_ca.pem android/app/src/main/res/raw/certum_trusted_root_ca.pem
          cat > android/app/src/main/res/xml/network_security_config.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <domain-config>
              <domain includeSubdomains="false">cdn.tsetmc.com</domain>
              <trust-anchors>
                <certificates src="system"/>
                <certificates src="@raw/certum_trusted_root_ca"/>
              </trust-anchors>
            </domain-config>
          </network-security-config>
          XML
      - name: Configure Dara Android manifest
        run: |
          python3 scripts/patch-release-signing.py android/app/build.gradle
          grep -n "signingConfigs.release" android/app/build.gradle
          test "$(grep -c 'signingConfig signingConfigs.release' android/app/build.gradle)" = "1"
      - name: Build release APK
        env:
          KS_PASS: ${{ secrets.DARA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DARA_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.DARA_KEY_PASSWORD }}
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Name APK with Dara version
        run: cp android/app/build/outputs/apk/release/*.apk "$DARA_APK_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: Dara-v${{ github.run_number }}-apk
          path: Dara-v*-build*.apk
      - name: Publish APK as a release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" "$DARA_APK_NAME" \
            --title "Dara APK #${{ github.run_number }}" \
            --notes "نسخه اندروید دارا، ساخته‌شده از آخرین commit شاخه main."
