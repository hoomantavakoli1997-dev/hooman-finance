name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm test
      - run: npm run web:build
      - name: Set build number
        run: |
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('app.json'));a.expo.android.versionCode=${{ github.run_number }};a.expo.extra={build:${{ github.run_number }}};fs.writeFileSync('app.json',JSON.stringify(a,null,2))"
      - run: npx expo prebuild --platform android --no-install
      - name: Shrink APK (only real phone CPUs)
        run: |
          cat >> android/gradle.properties <<'EOF2'
          reactNativeArchitectures=arm64-v8a,armeabi-v7a
          EOF2
      - name: Trust the Certum root for cdn.tsetmc.com only
        run: |
          set -e
          test "$(openssl x509 -in certs/certum_trusted_root_ca.pem -noout -fingerprint -sha256)" = "sha256 Fingerprint=FE:76:96:57:38:55:77:3E:37:A9:5E:7A:D4:D9:CC:96:C3:01:57:C1:5D:31:76:5B:A9:B1:57:04:E1:AE:78:FD"
          mkdir -p android/app/src/main/res/raw android/app/src/main/res/xml
          cp certs/certum_trusted_root_ca.pem android/app/src/main/res/raw/certum_trusted_root_ca.pem
          cat > android/app/src/main/res/xml/network_security_config.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <domain-config>
              <domain includeSubdomains="false">cdn.tsetmc.com</domain>
              <trust-anchors>
                <certificates src="system"/>
                <certificates src="@raw/certum_trusted_root_ca"/>
              </trust-anchors>
            </domain-config>
          </network-security-config>
          XML
          sed -i 's|<application |<application android:networkSecurityConfig="@xml/network_security_config" |' android/app/src/main/AndroidManifest.xml
          grep -q 'android:networkSecurityConfig="@xml/network_security_config"' android/app/src/main/AndroidManifest.xml
      - name: Keep only ARM CPUs in the APK
        run: |
          sed -i '0,/defaultConfig {/s//defaultConfig {\n        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }/' android/app/build.gradle
          grep -n -A1 "defaultConfig {" android/app/build.gradle | head -4
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: hooman-finance-apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/*.apk hooman-finance.apk
          gh release create "apk-${{ github.run_number }}" hooman-finance.apk \
            --title "Hooman Finance APK #${{ github.run_number }}" \
            --notes "نسخه‌ی آزمایشی اندروید (ساخته‌شده از شاخه‌ی main)."
