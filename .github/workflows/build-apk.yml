name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm test
      - run: npm run web:build
      - run: npx expo prebuild --platform android --no-install
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: hooman-finance-apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/*.apk hooman-finance.apk
          gh release create "apk-${{ github.run_number }}" hooman-finance.apk \
            --title "Hooman Finance APK #${{ github.run_number }}" \
            --notes "نسخه‌ی آزمایشی اندروید (ساخته‌شده از شاخه‌ی main)."
