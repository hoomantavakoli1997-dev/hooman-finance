name: Publish web app

on:
  push:
    branches: [main]
    paths: ['web/dist/pages/**', 'pwa/**', '.github/workflows/pages.yml']
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp web/dist/pages/index.html _site/index.html
          cp pwa/manifest.webmanifest pwa/icon-192.png pwa/icon-512.png _site/
          sed "s/__VERSION__/${GITHUB_SHA::8}/" pwa/sw.js > _site/sw.js
          touch _site/.nojekyll
      - name: Fetch latest TGJU prices (same-origin snapshot for the web version)
        run: |
          mkdir -p _site/prices
          curl -fsS --max-time 30 --retry 2 -A "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36" \
            https://call.tgju.org/ajax.json -o _site/prices/tgju.json
          python3 - <<'PY'
          import json
          d = json.load(open('_site/prices/tgju.json'))
          assert isinstance(d.get('current'), dict) and len(d['current']) > 20, 'unexpected TGJU response'
          print('quotes:', len(d['current']))
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
